apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: banking-demo-apps
  namespace: openshift-gitops
spec:
  generators:
  # Services deployed to onprem cluster
  - matrix:
      generators:
      - list:
          elements:
          - service: transaction-generator
          - service: transaction-processor
          - service: account-service
          - service: ledger-service
          - service: cluster-gateway
      - clusters:
          selector:
            matchLabels:
              cluster-role: onprem
          values:
            overlay: overlays/onprem
  # Services deployed to cloud cluster
  - matrix:
      generators:
      - list:
          elements:
          - service: transaction-generator
          - service: transaction-processor
          - service: account-service
          - service: ledger-service
          - service: cluster-gateway
      - clusters:
          selector:
            matchLabels:
              cluster-role: cloud
          values:
            overlay: overlays/cloud
  # onprem-only services (dashboard)
  - matrix:
      generators:
      - list:
          elements:
          - service: dashboard-backend
          - service: dashboard-frontend
      - clusters:
          selector:
            matchLabels:
              cluster-role: onprem
          values:
            overlay: base
  template:
    metadata:
      name: 'banking-{{service}}-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/mmartofel/rhacm-multi-cluster-scalability.git
        targetRevision: HEAD
        path: 'app-services/{{service}}/{{values.overlay}}'
      destination:
        server: '{{server}}'
        namespace: banking-demo
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
        - CreateNamespace=false
      ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
        - /spec/replicas
