apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: banking-mirrormaker2
  namespace: openshift-gitops
spec:
  generators:
  - clusters:
      selector:
        matchLabels:
          cluster-role: cloud
  template:
    metadata:
      name: banking-mirrormaker2
    spec:
      project: default
      source:
        repoURL: https://github.com/mmartofel/rhacm-multi-cluster-scalability.git
        targetRevision: HEAD
        path: infra/mirrormaker2
      destination:
        server: '{{server}}'
        namespace: banking-infra
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
        - CreateNamespace=false
