quarkus.application.name=cluster-gateway
quarkus.smallrye-health.root-path=/health

# Fabric8 KubernetesClient uses Vert.x HTTP client and dispatches Jackson
# deserialization callbacks onto the event loop; under load this exceeds the
# default 2s limit. Raise to 10s to suppress false-positive blocked-thread warnings.
quarkus.vertx.max-event-loop-execute-time=PT10S
