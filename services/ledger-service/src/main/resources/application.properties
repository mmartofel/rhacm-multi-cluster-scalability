quarkus.application.name=ledger-service

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource.username=${DATASOURCE_USER:postgres}
quarkus.datasource.password=${DATASOURCE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
# PostgreSQL JDBC has no read/connect timeout by default, so a connection that goes
# half-dead mid-session (e.g. the RHSI tunnel's backing Service being recreated) hangs
# indefinitely on Agroal's validate-on-borrow check instead of failing fast — the pool
# never self-heals without a pod restart. socketTimeout/connectTimeout make that check
# fail in seconds so Agroal destroys the dead connection and transparently opens a
# fresh one within the same acquisition attempt.
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.tcpKeepAlive=true

# Read datasource — cloud-local replica; falls back to write URL on onprem/dev
quarkus.datasource."read".db-kind=postgresql
quarkus.datasource."read".jdbc.url=${DATASOURCE_READ_URL:${DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}}
quarkus.datasource."read".username=${DATASOURCE_USER:postgres}
quarkus.datasource."read".password=${DATASOURCE_PASSWORD:postgres}
quarkus.datasource."read".jdbc.max-size=3
quarkus.datasource."read".jdbc.min-size=1
quarkus.datasource."read".health-enabled=false
quarkus.datasource."read".jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource."read".jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource."read".jdbc.additional-jdbc-properties.tcpKeepAlive=true

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# apicurio.registry.check-period-ms (Apicurio serde base config) independently
# re-validates the cached schema mapping every 30s by DEFAULT. The Apicurio Vert.x REST
# client has no configurable timeout in this version, so that periodic check hangs on
# Vert.x's ~60s default connect timeout when Apicurio is unreachable, permanently
# leaking a reactive-streams demand credit per occurrence — confirmed live on
# transaction-generator's producer side (SRMSG00034, does NOT self-heal once Apicurio
# is back). Raised to effectively "never" — safe since this schema never changes at
# runtime. See transaction-generator's application.properties for the full writeup.
mp.messaging.incoming.committed-in.connector=smallrye-kafka
mp.messaging.incoming.committed-in.topic=transactions-committed
mp.messaging.incoming.committed-in.group.id=ledger-updaters-${SOURCE_CLUSTER:unknown}
mp.messaging.incoming.committed-in.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.committed-in.apicurio.registry.url=${APICURIO_URL:http://localhost:8081}/apis/registry/v2
mp.messaging.incoming.committed-in.apicurio.registry.check-period-ms=86400000
mp.messaging.incoming.committed-in.auto.offset.reset=earliest

# Health
quarkus.smallrye-health.root-path=/health
# SmallRye Reactive Messaging registers Kafka channel health under BOTH @Liveness and
# @Readiness by default (single combined build-time switch, no liveness-only option).
# Confirmed live: a degraded channel (e.g. the Avro deserializer hanging on an
# unreachable Apicurio registry during an RHSI link-failure chaos test) was failing
# liveness and getting this pod killed and restarted every few minutes — even though
# the process itself was healthy and would recover on its own once Kafka/Apicurio came
# back (Kafka clients reconnect automatically). Restarting doesn't fix a downstream
# outage, it just adds churn. Disabling this only drops the Kafka-channel contribution
# to readiness too — the DB-down signal that matters most here still comes from
# Quarkus's built-in DataSourceHealthCheck, which is @Readiness-only and unaffected.
quarkus.messaging.health.enabled=false
