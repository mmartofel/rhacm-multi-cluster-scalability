quarkus.application.name=transaction-processor

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource.username=${DATASOURCE_USER:postgres}
quarkus.datasource.password=${DATASOURCE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
# PostgreSQL JDBC has no read/connect timeout by default, so a connection that goes
# half-dead mid-session (e.g. the RHSI tunnel's backing Service being recreated) hangs
# indefinitely on Agroal's validate-on-borrow check instead of failing fast — the pool
# never self-heals without a pod restart. socketTimeout/connectTimeout make that check
# fail in seconds so Agroal destroys the dead connection and transparently opens a
# fresh one within the same acquisition attempt.
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.tcpKeepAlive=true

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Incoming: transactions-raw
mp.messaging.incoming.transactions-in.connector=smallrye-kafka
mp.messaging.incoming.transactions-in.topic=transactions-raw
mp.messaging.incoming.transactions-in.group.id=transaction-processors-${SOURCE_CLUSTER:unknown}
mp.messaging.incoming.transactions-in.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.transactions-in.apicurio.registry.url=${APICURIO_URL:http://localhost:8081}/apis/registry/v2
mp.messaging.incoming.transactions-in.auto.offset.reset=latest

# Outgoing: transactions-dlq
mp.messaging.outgoing.transactions-dlq-out.connector=smallrye-kafka
mp.messaging.outgoing.transactions-dlq-out.topic=transactions-dlq
mp.messaging.outgoing.transactions-dlq-out.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.transactions-dlq-out.apicurio.registry.url=${APICURIO_URL:http://localhost:8081}/apis/registry/v2
mp.messaging.outgoing.transactions-dlq-out.apicurio.registry.auto-register=true
mp.messaging.outgoing.transactions-dlq-out.acks=1

# Outgoing: transactions-committed
mp.messaging.outgoing.transactions-committed-out.connector=smallrye-kafka
mp.messaging.outgoing.transactions-committed-out.topic=transactions-committed
mp.messaging.outgoing.transactions-committed-out.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.transactions-committed-out.apicurio.registry.url=${APICURIO_URL:http://localhost:8081}/apis/registry/v2
mp.messaging.outgoing.transactions-committed-out.apicurio.registry.auto-register=true
mp.messaging.outgoing.transactions-committed-out.acks=all

# REST client for account-service
quarkus.rest-client.account-service.url=${ACCOUNT_SERVICE_URL:http://account-service:8080}
quarkus.rest-client.account-service.connect-timeout=5000
quarkus.rest-client.account-service.read-timeout=5000

# Health
quarkus.smallrye-health.root-path=/health
# SmallRye Reactive Messaging registers Kafka channel health under BOTH @Liveness and
# @Readiness by default (single combined build-time switch, no liveness-only option).
# Confirmed live: a degraded channel (e.g. the Avro deserializer hanging on an
# unreachable Apicurio registry during an RHSI link-failure chaos test) was failing
# liveness and getting this pod killed and restarted every few minutes — even though
# the process itself was healthy and would recover on its own once Kafka/Apicurio came
# back (Kafka clients reconnect automatically). Restarting doesn't fix a downstream
# outage, it just adds churn. Disabling this only drops the Kafka-channel contribution
# to readiness too — the DB-down signal that matters most here still comes from
# Quarkus's built-in DataSourceHealthCheck, which is @Readiness-only and unaffected.
quarkus.messaging.health.enabled=false
