quarkus.application.name=transaction-generator

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Outgoing channel → transactions-raw
mp.messaging.outgoing.transactions-out.connector=smallrye-kafka
mp.messaging.outgoing.transactions-out.topic=transactions-raw
mp.messaging.outgoing.transactions-out.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.transactions-out.apicurio.registry.url=${APICURIO_URL:http://localhost:8081}/apis/registry/v2
mp.messaging.outgoing.transactions-out.apicurio.registry.auto-register=true
# find-latest was true: forced an Apicurio round-trip on every single send instead of
# caching after the first resolution. One fixed schema for this topic's whole life, so
# dropping it changes nothing about which schema is used — the serializer now reuses
# its cache after the first successful send.
#
# That alone wasn't sufficient — confirmed live: SRMSG00034 (Insufficient downstream
# requests to emit item) still recurred after an RHSI outage even with find-latest
# already removed, and kept recurring for minutes AFTER the link was restored (proving
# it wasn't a live-network issue at that point). Root cause: Apicurio's serde base
# config (io.apicurio.registry.serde.SerdeConfig.CHECK_PERIOD_MS) independently
# re-validates the cached schema mapping against the registry every 30s by DEFAULT,
# regardless of find-latest. The Apicurio Vert.x REST client has no configurable
# timeout in this version (confirmed by decompiling VertxHttpClient.createClientOptions
# — only TLS options are exposed), so that periodic check hangs for Vert.x's ~60s
# default connect timeout when Apicurio is unreachable, and the reactive Kafka sink
# never gets a completion callback for whatever record was in flight when it fired —
# permanently leaking one demand credit. Enough leaked credits over enough 30s cycles
# during an outage exhausts max-in-flight for good; unlike a live network issue this
# does NOT self-heal once Apicurio comes back, since the credits are already gone.
# check-period-ms raised to effectively "never" for the life of a pod — safe here since
# the schema truly never changes at runtime.
mp.messaging.outgoing.transactions-out.apicurio.registry.check-period-ms=86400000
mp.messaging.outgoing.transactions-out.acks=all
mp.messaging.outgoing.transactions-out.max-in-flight=1024

# TPS controlled via env var or PUT /api/generator/tps/{rate}
TPS_RATE=100

# Health
quarkus.smallrye-health.root-path=/health
