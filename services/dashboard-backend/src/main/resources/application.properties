quarkus.application.name=dashboard-backend

# Service URLs (overridden by env vars in Deployment)
ONPREM_GATEWAY_URL=http://cluster-gateway.banking-demo.svc.cluster.local:8080
CLOUD_GATEWAY_URL=http://cloud-cluster-gateway.banking-infra.svc.cluster.local:8080
ONPREM_LEDGER_URL=http://ledger-service.banking-demo.svc.cluster.local:8080
CLOUD_LEDGER_URL=http://cloud-ledger-service.banking-infra.svc.cluster.local:8080

# Onprem's practical generation capacity (TPS) — Auto Burst (Traffic Split=100%) threshold
onprem.capacity.tps=100

# RHACS Central — onprem-only, in-cluster (see CLAUDE.md's RHACS notes). RHACS_API_TOKEN
# is a read-only ("Analyst" role) token minted by bootstrap-phase2.sh, injected from the
# rhacs-dashboard-credentials Secret.
RHACS_CENTRAL_URL=https://central.stackrox.svc.cluster.local:443
RHACS_API_TOKEN=

# Health
quarkus.smallrye-health.root-path=/health

# Stale WebSocket teardown is a normal lifecycle event, not an error
quarkus.log.category."io.quarkus.websockets.next.runtime".level=WARN
