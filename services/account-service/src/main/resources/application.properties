quarkus.application.name=account-service

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource.username=${DATASOURCE_USER:postgres}
quarkus.datasource.password=${DATASOURCE_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
# Without an explicit dialect, Hibernate opens a JTA-isolated connection at boot
# purely to sniff JDBC metadata for dialect autodetection — that path has a bug
# (HHH000342: JtaIsolationDelegate.sqlExceptionHelper() is null) that NPEs instead
# of failing cleanly, adding a scary stack trace and several seconds to every boot.
# Setting the dialect explicitly is NOT sufficient to skip it, and there is no
# working config-based fix in Quarkus 3.9.5: FastBootHibernatePersistenceProvider
# hardcodes runtimeSettingsBuilder.put("hibernate.temp.use_jdbc_metadata_defaults",
# "true") unconditionally (confirmed by reading that exact source file for this
# Quarkus version) — a quarkus.hibernate-orm.unsupported-properties override for
# that same key is silently discarded with its own WARN ("Quarkus already set
# that property independently"), confirmed live. See CLAUDE.md's Phase 2 notes
# for the full writeup — this WARN is accepted as a non-fixable-via-config,
# non-fatal, intermittent Quarkus/Hibernate limitation in this version.
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
# PostgreSQL JDBC has no read/connect timeout by default, so a connection that goes
# half-dead mid-session (e.g. the RHSI tunnel's backing Service being recreated) hangs
# indefinitely on Agroal's validate-on-borrow check instead of failing fast — the pool
# never self-heals without a pod restart. socketTimeout/connectTimeout make that check
# fail in seconds so Agroal destroys the dead connection and transparently opens a
# fresh one within the same acquisition attempt.
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.tcpKeepAlive=true

# Read datasource — cloud-local replica; falls back to write URL on onprem/dev
quarkus.datasource."read".db-kind=postgresql
quarkus.datasource."read".jdbc.url=${DATASOURCE_READ_URL:${DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}}
quarkus.datasource."read".username=${DATASOURCE_USER:postgres}
quarkus.datasource."read".password=${DATASOURCE_PASSWORD:postgres}
quarkus.datasource."read".jdbc.max-size=3
quarkus.datasource."read".jdbc.min-size=1
quarkus.datasource."read".jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource."read".jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource."read".jdbc.additional-jdbc-properties.tcpKeepAlive=true

# Balance cache — 30s TTL to balance freshness vs. RPS on PostgreSQL
quarkus.cache.caffeine.balance.expire-after-write=30S
quarkus.cache.caffeine.balance.maximum-size=10000

# Health
quarkus.smallrye-health.root-path=/health
