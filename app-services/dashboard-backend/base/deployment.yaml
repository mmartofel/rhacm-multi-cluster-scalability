apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-backend
  namespace: banking-demo
  labels:
    app: dashboard-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-backend
  template:
    metadata:
      labels:
        app: dashboard-backend
    spec:
      containers:
      - name: dashboard-backend
        image: quay.io/mmartofe/banking-demo-dashboard-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: ONPREM_GATEWAY_URL
          value: http://cluster-gateway.banking-demo.svc.cluster.local:8080
        - name: CLOUD_GATEWAY_URL
          value: http://cloud-cluster-gateway.banking-infra.svc.cluster.local:8080
        - name: ONPREM_LEDGER_URL
          value: http://ledger-service.banking-demo.svc.cluster.local:8080
        - name: CLOUD_LEDGER_URL
          value: http://cloud-ledger-service.banking-infra.svc.cluster.local:8080
        - name: RHACS_CENTRAL_URL
          value: https://central.stackrox.svc.cluster.local:443
        - name: RHACS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: rhacs-dashboard-credentials
              key: token
              # dashboard-backend is deployed/waited-on at bootstrap-phase2.sh Step 10,
              # before the RHACS step (11) that creates this secret even runs — must
              # stay optional so a fresh bootstrap doesn't fail waiting on this pod.
              # RhacsPoller treats a blank token as "not configured" and degrades
              # gracefully rather than crashing.
              optional: true
        # CPU bumped from 100m/200m — confirmed live via cgroup cpu.stat on a sibling
        # JVM service (ledger-service): 784/4433 periods throttled (~17.7%), 109s of
        # accumulated throttled time within ~8 minutes of pod lifetime. JVM startup
        # (JIT, CDI bootstrap) is CPU-heavy and was starved by the old limit; nodes
        # have massive headroom (max 56% CPU utilization observed across the cluster).
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 750m
            memory: 512Mi
        # See ledger-service/base/deployment.yaml for the full writeup: a
        # startupProbe decouples liveness/readiness from real startup time
        # instead of racing a fixed initialDelaySeconds against it.
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 15
      imagePullSecrets:
      - name: quay-pull-secret
