apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: "jdbc:postgresql://postgresql-primary.banking-infra.svc.cluster.local:5432/postgres"
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "cloud"
  target:
    kind: Deployment
    name: account-service
# Cap the CPU HPA: every replica holds up to QUARKUS_DATASOURCE_JDBC_MAX_SIZE
# connections to the shared onprem PostgreSQL (max_connections=100). Confirmed
# live 2026-09-29: rollout CPU spikes scaled this to 13 replicas and exhausted
# max_connections ("too many clients already"), taking down BOTH clusters.
- patch: |-
    - op: replace
      path: /spec/maxReplicas
      value: 4
  target:
    kind: HorizontalPodAutoscaler
    name: account-service
