apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: banking-demo
  labels:
    app: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
      - name: account-service
        image: quay.io/mmartofe/banking-demo-account-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DATASOURCE_URL
          value: jdbc:postgresql://postgres-primary.banking-infra.svc.cluster.local:5432/postgres
        - name: DATASOURCE_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: user
        - name: DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: password
        - name: SOURCE_CLUSTER
          value: onprem
        - name: QUARKUS_DATASOURCE_JDBC_MAX_SIZE
          value: "3"
        - name: QUARKUS_DATASOURCE_JDBC_MIN_SIZE
          value: "1"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 350Mi
        # See ledger-service/base/deployment.yaml for the full writeup: a
        # startupProbe decouples liveness/readiness from real (Kafka+JTA+DB)
        # startup time instead of racing a fixed initialDelaySeconds against it.
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 15
      imagePullSecrets:
      - name: quay-pull-secret
