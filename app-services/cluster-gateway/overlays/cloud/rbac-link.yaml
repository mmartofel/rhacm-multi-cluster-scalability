apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-gateway-link-manager
  namespace: banking-infra
rules:
# Simulates an RHSI link failure by tearing down/recreating the Skupper Listeners that
# expose onprem's Kafka/PostgreSQL/Apicurio to cloud — NOT the Link CR itself, since that
# would also sever the separate Listener/Connector pair the dashboard's own control-plane
# traffic depends on (cloud-cluster-gateway/cloud-ledger-service), making the UI's
# restore button unable to ever reach cloud again. See LinkResource.java.
- apiGroups: ["skupper.io"]
  resources: ["listeners"]
  resourceNames: ["kafka-bootstrap", "postgresql-primary", "apicurio-registry"]
  verbs: ["get", "delete"]
- apiGroups: ["skupper.io"]
  resources: ["listeners"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-gateway-link-manager
  namespace: banking-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-gateway-link-manager
subjects:
- kind: ServiceAccount
  name: cluster-gateway
  namespace: banking-demo
