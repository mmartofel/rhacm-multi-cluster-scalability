apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-gateway-link-manager
  namespace: banking-infra
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["onprem-link-token"]
  verbs: ["get", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-gateway-link-manager
  namespace: banking-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-gateway-link-manager
subjects:
- kind: ServiceAccount
  name: cluster-gateway
  namespace: banking-demo
