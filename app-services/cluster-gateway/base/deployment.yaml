apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-gateway
  namespace: banking-demo
  labels:
    app: cluster-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-gateway
  template:
    metadata:
      labels:
        app: cluster-gateway
    spec:
      serviceAccountName: cluster-gateway
      containers:
      - name: cluster-gateway
        image: quay.io/mmartofe/banking-demo-cluster-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SOURCE_CLUSTER
          value: onprem
        - name: TRAFFIC_WEIGHT
          value: "100"
        - name: QUARKUS_VERTX_MAX_EVENT_LOOP_EXECUTE_TIME
          value: "PT10S"
        # CPU bumped from 100m/300m — confirmed live via cgroup cpu.stat on a sibling
        # JVM service (ledger-service): 784/4433 periods throttled (~17.7%), 109s of
        # accumulated throttled time within ~8 minutes of pod lifetime. JVM startup
        # (JIT, CDI/Kubernetes-client bootstrap) is CPU-heavy and was starved by the
        # old limit; nodes have massive headroom (max 56% CPU utilization observed
        # across the cluster), so there's no scheduling-pressure reason to keep it
        # this tight.
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: 750m
            memory: 256Mi
        # See ledger-service/base/deployment.yaml for the full writeup: a
        # startupProbe decouples liveness/readiness from real startup time
        # instead of racing a fixed initialDelaySeconds against it.
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 15
      imagePullSecrets:
      - name: quay-pull-secret
