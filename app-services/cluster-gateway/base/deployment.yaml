apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-gateway
  namespace: banking-demo
  labels:
    app: cluster-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-gateway
  template:
    metadata:
      labels:
        app: cluster-gateway
    spec:
      serviceAccountName: cluster-gateway
      containers:
      - name: cluster-gateway
        image: quay.io/mmartofe/banking-demo-cluster-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SOURCE_CLUSTER
          value: onprem
        - name: TRAFFIC_WEIGHT
          value: "100"
        - name: QUARKUS_VERTX_MAX_EVENT_LOOP_EXECUTE_TIME
          value: "PT10S"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        # See ledger-service/base/deployment.yaml for the full writeup: a
        # startupProbe decouples liveness/readiness from real startup time
        # instead of racing a fixed initialDelaySeconds against it.
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 15
      imagePullSecrets:
      - name: quay-pull-secret
