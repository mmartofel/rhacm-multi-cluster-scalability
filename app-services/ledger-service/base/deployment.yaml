apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: banking-demo
  labels:
    app: ledger-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
    spec:
      containers:
      - name: ledger-service
        image: quay.io/mmartofe/banking-demo-ledger-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: banking-kafka-kafka-bootstrap.banking-infra.svc.cluster.local:9092
        - name: APICURIO_URL
          value: http://apicurio-registry.banking-infra.svc.cluster.local:8080
        - name: SOURCE_CLUSTER
          value: onprem
        - name: DATASOURCE_URL
          value: jdbc:postgresql://postgres-primary.banking-infra.svc.cluster.local:5432/postgres
        - name: DATASOURCE_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: user
        - name: DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: password
        - name: QUARKUS_DATASOURCE_JDBC_MAX_SIZE
          value: "3"
        - name: QUARKUS_DATASOURCE_JDBC_MIN_SIZE
          value: "1"
        # CPU bumped from 100m/200m — confirmed live via cgroup cpu.stat: 784/4433
        # periods throttled (~17.7%), 109s of accumulated throttled time within ~8
        # minutes of pod lifetime. JVM startup (JIT, CDI/Hibernate/Kafka bootstrap) is
        # CPU-heavy and was starved by the old limit; nodes have massive headroom (max
        # 56% CPU utilization observed across the cluster), so there's no
        # scheduling-pressure reason to keep it this tight.
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        # Kafka + JTA + Avro startup can take 60-90s under real cluster conditions
        # (RHSI tunnel latency, Kafka bootstrap, cold JIT) — the startupProbe gates
        # liveness/readiness until the app is genuinely ready, instead of racing a
        # fixed initialDelaySeconds against a variable startup time (confirmed live:
        # this exact race killed ledger-service via a liveness-probe SIGTERM at ~70s
        # against a 65.5s real startup, restart count 1 — see CLAUDE.md issue #17).
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 15
      imagePullSecrets:
      - name: quay-pull-secret
