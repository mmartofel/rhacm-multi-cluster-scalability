apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-frontend
  namespace: banking-demo
  labels:
    app: dashboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-frontend
  template:
    metadata:
      labels:
        app: dashboard-frontend
    spec:
      containers:
      - name: dashboard-frontend
        image: quay.io/mmartofe/banking-demo-dashboard-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        # nginx/static content, no Kafka/DB dependency — short budget is enough
        # (see ledger-service/base/deployment.yaml for the full startupProbe writeup).
        startupProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 3
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 15
      imagePullSecrets:
      - name: quay-pull-secret
