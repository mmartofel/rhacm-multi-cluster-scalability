# Cloud: single standby instance — will be promoted to streaming replica
# after Skupper link is established and pgBackRest stanza is initialized.
# The bootstrap-phase1.sh script enables standby mode once the link is verified.
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: postgres
  namespace: banking-infra
spec:
  instances:
  - name: instance1
    replicas: 1
    # The instances list is replaced wholesale by this patch, so the sizing from
    # base/postgres.yaml has to be repeated here.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    sidecars:
      replicaCertCopy:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
    dataVolumeClaimSpec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
  proxy:
    pgBouncer:
      replicas: 1
