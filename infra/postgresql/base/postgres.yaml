apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: postgres
  namespace: banking-infra
spec:
  postgresVersion: 16
  # max_connections 100 -> 300: one onprem primary serves every service on BOTH
  # clusters (cloud via RHSI). At 100 it was exhausted on 2026-09-29 ("too many
  # clients already"), taking both clusters down. Needs a PG restart to apply —
  # PGO rolling restart via the postgres-operator.crunchydata.com/restart annotation.
  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          max_connections: 300
  instances:
  - name: instance1
    replicas: 3
    dataVolumeClaimSpec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
  proxy:
    pgBouncer:
      replicas: 2
  backups:
    pgbackrest:
      repos:
      - name: repo1
        volume:
          volumeClaimSpec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 30Gi
