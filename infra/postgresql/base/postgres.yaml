apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: postgres
  namespace: banking-infra
spec:
  postgresVersion: 16
  # max_connections 100 -> 300: one onprem primary serves every service on BOTH
  # clusters (cloud via RHSI). At 100 it was exhausted on 2026-09-29 ("too many
  # clients already"), taking both clusters down. Needs a PG restart to apply —
  # PGO rolling restart via the postgres-operator.crunchydata.com/restart annotation.
  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          max_connections: 300
  instances:
  - name: instance1
    replicas: 3
    # Explicit sizing (issue #23) — measured ~230Mi idle on the primary.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    sidecars:
      replicaCertCopy:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
    dataVolumeClaimSpec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
  proxy:
    pgBouncer:
      replicas: 2
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
      sidecars:
        pgbouncerConfig:
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
  backups:
    pgbackrest:
      repoHost:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
      jobs:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
      sidecars:
        pgbackrest:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        pgbackrestConfig:
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      repos:
      - name: repo1
        volume:
          volumeClaimSpec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 30Gi
