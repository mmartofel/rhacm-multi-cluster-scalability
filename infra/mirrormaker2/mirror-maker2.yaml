apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaMirrorMaker2
metadata:
  name: banking-mirror
  namespace: banking-infra
spec:
  version: 4.2.0
  # Re-enabled (2026-09-04) — the "self-replication via GCP-local Kafka" issue that
  # forced this to 0 (see git history, commit 6dbb9e0) was a genuine advertised-listener
  # DNS collision between onprem's and cloud's identically-named Kafka clusters, still
  # present today, not something specific to the old GCP/AWS environment. Fixed by
  # routing through the dedicated "mm2" listener (see infra/kafka/base/kafka.yaml and
  # infra/skupper/{onprem/connectors,cloud/listeners}.yaml) instead of the plain/tls
  # listeners MM2 previously bootstrapped through — see CLAUDE.md finding 6.
  replicas: 1
  target:
    alias: cloud
    bootstrapServers: banking-kafka-kafka-bootstrap.banking-infra.svc.cluster.local:9092
    groupId: banking-mirror-connect
    configStorageTopic: mm2-configs
    offsetStorageTopic: mm2-offsets
    statusStorageTopic: mm2-status
    config:
      config.storage.replication.factor: "3"
      offset.storage.replication.factor: "3"
      status.storage.replication.factor: "3"
  mirrors:
  - source:
      alias: onprem
      bootstrapServers: kafka-bootstrap-mm2:9094
    # Only transactions-raw is meant to be DR-mirrored (see "Critical Data Flow" at
    # the top of CLAUDE.md and the OWNED_PARTITIONS guard in TransactionProcessor,
    # which exists specifically because this topic is mirrored). "transactions-.*"
    # was too broad — confirmed live (2026-09-04) it silently also mirrored
    # transactions-committed, which cloud's LedgerUpdater (unlike TransactionProcessor)
    # has no partition-ownership filter or idempotency check for, so it double-persisted
    # every onprem-committed transaction into the shared onprem ledger_entries table:
    # once from onprem's own ledger-service, again from cloud's consuming the
    # MM2-mirrored copy. Never caught earlier because MM2 was replicas:0 the whole
    # time this interaction was possible. transactions-dlq has no cloud-side consumer
    # either way, so restricting to exactly transactions-raw matches the one thing
    # that's actually meant to cross the tunnel.
    topicsPattern: "transactions-raw"
    sourceConnector:
      config:
        replication.factor: "3"
        offset-syncs.topic.replication.factor: "3"
        sync.topic.acls.enabled: "false"
        # Keep original topic names on cloud (no onprem. prefix)
        replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
        # Start from latest if no stored offset exists (prevents backlog replay after MM2 wipe)
        auto.offset.reset: latest
