# Namespace-level limits for banking-demo — applied by bootstrap-phase0.sh on both
# clusters (not by Argo CD: its controller only holds the `admin` ClusterRole here,
# which cannot write ResourceQuota/LimitRange).
#
# Quota = worst case on one cluster + ~20% headroom. Recompute it whenever a
# replica ceiling or a container's requests/limits change:
#
#   workload                          pods  requests (cpu/mem)   limits (cpu/mem)
#   transaction-processor (KEDA max)   20   6000m / 5120Mi       20    / 10240Mi
#   account-service (HPA max)           4   1000m / 1024Mi        4    /  1400Mi
#   ledger, gateway, generator,
#     dashboard-backend, -frontend      5    900m / 1024Mi        3.45 /  2048Mi
#   rolling-update surge (25% of 20,
#     +1 of 4, +1 per single)          11   2650m / 2560Mi        9.45 /  4958Mi
#   total                              40  10550m / 9728Mi       36.9  / 18646Mi
#
# If the quota is ever hit, pods are not created and the ReplicaSet reports
# "FailedCreate ... exceeded quota" — smoke-test.sh checks for that event.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: banking-demo-quota
  namespace: banking-demo
spec:
  hard:
    requests.cpu: "13"
    requests.memory: 12Gi
    limits.cpu: "44"
    limits.memory: 22Gi
    pods: "45"
---
# Safety net only — every container in app-services/ sets its own requests and
# limits. The defaults keep a pod without them admissible under the quota above
# (a quota on requests/limits rejects any pod that leaves them unset).
apiVersion: v1
kind: LimitRange
metadata:
  name: banking-demo-limits
  namespace: banking-demo
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 256Mi
    max:
      cpu: "2"
      memory: 1Gi
