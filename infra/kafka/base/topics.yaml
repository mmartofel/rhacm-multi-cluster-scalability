apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: transactions-raw
  namespace: banking-infra
  labels:
    strimzi.io/cluster: banking-kafka
spec:
  partitions: 24
  replicas: 3
  config:
    retention.ms: "7200000"
    retention.bytes: "134217728"
    segment.bytes: "33554432"
    min.insync.replicas: "2"
