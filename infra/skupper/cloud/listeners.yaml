apiVersion: skupper.io/v2alpha1
kind: Listener
metadata:
  name: kafka-bootstrap
  namespace: banking-infra
spec:
  routingKey: kafka-bootstrap
  port: 9092
  host: kafka-bootstrap
---
apiVersion: skupper.io/v2alpha1
kind: Listener
metadata:
  name: postgresql-primary
  namespace: banking-infra
spec:
  routingKey: postgresql-primary
  port: 5432
  host: postgresql-primary
---
apiVersion: skupper.io/v2alpha1
kind: Listener
metadata:
  name: apicurio-registry
  namespace: banking-infra
spec:
  routingKey: apicurio-registry
  port: 8080
  host: apicurio-registry
---
# MirrorMaker2 tunnel — see the matching Connectors in infra/skupper/onprem/connectors.yaml
# and the "mm2" listener comment in infra/kafka/base/kafka.yaml. host must match the
# advertisedHostTemplate-generated per-broker hostname exactly, since that's what the
# Kafka client resolves after bootstrapping.
apiVersion: skupper.io/v2alpha1
kind: Listener
metadata:
  name: kafka-bootstrap-mm2
  namespace: banking-infra
spec:
  routingKey: kafka-bootstrap-mm2
  port: 9094
  host: kafka-bootstrap-mm2
---
